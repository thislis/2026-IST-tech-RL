# PREP-01 reproducible Python runtime lock for macOS arm64.
#
# Installation order (from this repository root):
#   uv venv .venv --python 3.10.12
#   uv pip install --python .venv/bin/python -r requirements.lock
#   uv pip install --python .venv/bin/python "mlagents-envs==1.1.0" --no-deps
#   uv pip install --python .venv/bin/python ../blackout-env --no-deps
#
# mlagents-envs and blackout-env are deliberately installed separately. Their
# declared PettingZoo requirements conflict even though mlagents-envs does not
# import PettingZoo. grpcio 1.51.3 is the first usable universal binary in this
# environment; grpcio 1.48.2 has no Apple Silicon wheel.

